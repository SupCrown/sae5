spring.profiles.active=development
#spring.profiles.active=production
#spring.profiles.active=staging

# IMPORTANT pour le developpement :
# "update" signifie que si vous creez une classe Java (Entity),
# Spring mettra a jour la BDD automatiquement (creation de tables).
spring.jpa.hibernate.ddl-auto=update
# Affiche les requetes SQL dans la console (pratique pour le debuggage)
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
com.group.project.jwt.secret=${JWT_SECRET}
com.group.project.jwt.expires-in=29000
com.group.project.cookie.name=authToken
com.group.project.cookie.expires-in=29000

