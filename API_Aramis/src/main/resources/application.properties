# 2. Configuration JPA / Hibernate (ce qui fait le lien entre Java et SQL)
# Affiche les requêtes SQL dans la console (pratique pour le débuggage)
spring.jpa.show-sql=true

# IMPORTANT pour le développement :
# "update" signifie que si vous créez une classe Java (Entity),
# Spring mettra à jour la BDD automatiquement (création de tables).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect